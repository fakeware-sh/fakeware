name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - name: publint and pack smoke
        run: |
          for dir in packages/core apps/cli apps/create-fakeware plugins/plugin-pickware; do
            (cd "$dir" && bunx publint && bun pm pack --destination "$RUNNER_TEMP/pack-smoke")
          done
